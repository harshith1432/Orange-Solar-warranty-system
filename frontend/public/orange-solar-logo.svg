<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="100%">
  <defs>
    <!-- Sun Glow / Horizon Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5821f" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich Orange Brand Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="50%" stop-color="#f5821f"/>
      <stop offset="100%" stop-color="#d95b00"/>
    </linearGradient>

    <!-- Solar Green Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ea580c" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g id="OrangeSolarLogoGroup">
    <!-- Sub-heading: A SUN ZONE PRODUCT -->
    <text x="178" y="24" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="11.5" 
          font-weight="800" 
          letter-spacing="2.5" 
          fill="#1e293b">
      A SUN ZONE PRODUCT
    </text>

    <!-- Leaf atop capital 'O' -->
    <g transform="translate(48, 12) rotate(-8)">
      <path d="M 0,22 C 2,10 12,2 26,0 C 26,14 18,24 4,25 Z" 
            fill="url(#leafGrad)" />
      <!-- Leaf central vein -->
      <path d="M 2,21 Q 12,12 24,2" 
            stroke="#15803d" 
            stroke-width="1.2" 
            fill="none" 
            stroke-linecap="round"/>
    </g>

    <!-- The word 'Orange' in custom stylized curves matching the brochure -->
    <g filter="url(#logoShadow)">
      <!-- Capital O with solar ring geometry -->
      <path d="M 52,38 C 28,38 10,54 10,74 C 10,94 28,104 52,104 C 76,104 94,94 94,74 C 94,54 76,38 52,38 Z M 52,53 C 65,53 74,62 74,74 C 74,86 65,89 52,89 C 39,89 30,86 30,74 C 30,62 39,53 52,53 Z" 
            fill="url(#orangeGrad)"/>

      <!-- Letter 'r' -->
      <path d="M 98,54 L 115,54 L 115,62 C 119,56 125,53 133,54 L 131,70 C 124,69 117,72 115,77 L 115,103 L 98,103 Z" 
            fill="url(#orangeGrad)"/>

      <!-- Letter 'a' -->
      <path d="M 163,54 L 180,54 L 180,103 L 165,103 L 165,96 C 160,101 153,105 144,105 C 132,105 122,96 122,83 C 122,69 133,62 147,61 C 153,61 159,62 163,64 L 163,62 C 163,56 157,52 149,52 C 141,52 135,55 131,58 L 126,46 C 133,40 144,38 155,38 C 163,38 168,40 172,44 C 177,48 179,54 179,62 Z M 163,77 C 159,75 154,74 149,74 C 142,74 138,77 138,83 C 138,89 143,92 149,92 C 156,92 161,87 163,81 Z" 
            fill="url(#orangeGrad)"/>

      <!-- Letter 'n' -->
      <path d="M 189,54 L 206,54 L 206,62 C 211,56 218,53 228,53 C 241,53 248,61 248,75 L 248,103 L 231,103 L 231,78 C 231,70 227,66 220,66 C 213,66 208,70 206,77 L 206,103 L 189,103 Z" 
            fill="url(#orangeGrad)"/>

      <!-- Letter 'g' -->
      <path d="M 283,54 L 283,96 C 283,111 272,120 256,120 C 244,120 234,115 229,108 L 239,97 C 243,102 249,106 256,106 C 263,106 267,101 267,93 L 267,87 C 263,92 256,96 248,96 C 234,96 225,85 225,74 C 225,60 235,53 248,53 C 256,53 263,57 267,62 L 267,54 Z M 267,74 C 267,68 262,64 256,64 C 249,64 244,68 244,74 C 244,81 249,85 256,85 C 262,85 267,81 267,74 Z" 
            fill="url(#orangeGrad)"/>

      <!-- Letter 'e' -->
      <path d="M 315,75 L 290,75 C 291,66 296,62 303,62 C 309,62 313,65 315,69 L 327,61 C 322,53 313,48 302,48 C 287,48 275,59 275,76 C 275,93 287,104 303,104 C 318,104 328,94 328,79 L 328,75 Z M 290,83 C 292,89 297,93 303,93 C 310,93 314,89 316,83 Z" 
            fill="url(#orangeGrad)"/>
    </g>

    <!-- Sub-label: SOLAR (Solid, crisp, wide tracked) -->
    <g transform="translate(182, 108)">
      <text x="0" y="0" 
            font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
            font-size="14" 
            font-weight="900" 
            letter-spacing="5" 
            fill="#0f172a">
        SOLAR
      </text>
    </g>

    <!-- TM superscript -->
    <text x="323" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#64748b">TM</text>
  </g>
</svg>
